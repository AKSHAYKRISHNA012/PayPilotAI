version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: paypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paypilot_saas}
      POSTGRES_USER: ${POSTGRES_USER:-paypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypilot_secure_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paypilot} -d ${POSTGRES_DB:-paypilot_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  paypilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paypilot-saas-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:-paypilot-prod-enterprise-key-2026}
      - JWT_SECRET=${JWT_SECRET:-paypilot-jwt-enterprise-key-2026}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_paypilot_saas_2026}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-sec_paypilot_live_demo_test}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-whsec_paypilot_hmac_2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-paypilot}:${POSTGRES_PASSWORD:-paypilot_secure_2026}@postgres:5432/${POSTGRES_DB:-paypilot_saas}
    volumes:
      - paypilot-data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  paypilot-data:
    driver: local
  postgres-data:
    driver: local
